<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1118" />
      <stop offset="50%" stop-color="#111d27" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern -->
  <path d="M0 80 H600 M0 160 H600 M0 240 H600 M0 320 H600 M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400" stroke="#1e293b" stroke-width="1" opacity="0.45" />

  <!-- Glowing Mascot Silhouette -->
  <g transform="translate(300, 200)">
    <!-- Aura Glow -->
    <circle r="90" fill="#10b981" opacity="0.2" filter="url(#glow)" />
    <!-- Character Body -->
    <rect x="-65" y="-60" width="130" height="120" rx="35" fill="url(#emeraldGrad)" filter="url(#glow)" />
    <!-- Gamer Headphones -->
    <path d="M-80 -20 C-80 -80 80 -80 80 -20" stroke="#0284c7" stroke-width="12" fill="none" stroke-linecap="round" />
    <rect x="-86" y="-30" width="18" height="35" rx="8" fill="#38bdf8" />
    <rect x="68" y="-30" width="18" height="35" rx="8" fill="#38bdf8" />
    <!-- Eyes -->
    <circle cx="-25" cy="-10" r="12" fill="#ffffff" />
    <circle cx="25" cy="-10" r="12" fill="#ffffff" />
    <circle cx="-23" cy="-10" r="6" fill="#07090e" />
    <circle cx="27" cy="-10" r="6" fill="#07090e" />
    <!-- Smile -->
    <path d="M-20 20 Q0 35 20 20" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- Crown -->
    <polygon points="-25,-70 -15,-60 0,-75 15,-60 25,-70 20,-50 -20,-50" fill="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Title Badge -->
  <rect x="30" y="30" width="170" height="32" rx="16" fill="#111822" stroke="#243244" stroke-width="1.5" />
  <circle cx="46" cy="46" r="6" fill="#10b981" />
  <text x="60" y="51" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="12" letter-spacing="1">TIKTOK LIVE READY</text>

  <!-- Bottom Labels -->
  <text x="40" y="330" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="28" letter-spacing="0.5">GIGANTE TIKTOKER</text>
  <text x="40" y="360" fill="#94a3b8" font-family="sans-serif" font-size="14">Plug &amp; Play Interactive Mascot v1.2</text>
  
  <rect x="465" y="325" width="95" height="30" rx="15" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1.5" />
  <text x="512" y="345" fill="#a7f3d0" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">CANAL ALFA</text>
</svg>
