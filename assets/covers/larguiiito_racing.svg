<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#190a36"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>

    <!-- Asphalt Road Gradient -->
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242b35"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>

    <!-- Formula 1 Car Gradients -->
    <linearGradient id="redCarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#9b0000"/>
    </linearGradient>

    <linearGradient id="cyanCarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#0044aa"/>
    </linearGradient>

    <linearGradient id="goldCarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Fire / Meteor Gradient -->
    <radialGradient id="meteorFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffea00"/>
      <stop offset="60%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#dd2c00" stop-opacity="0"/>
    </radialGradient>

    <!-- Pegasus Glow -->
    <radialGradient id="celestialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="50%" stop-color="#80deea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glowF1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky & Stadium Backdrop -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Speed Stars / Sparkles -->
  <circle cx="120" cy="60" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="280" cy="40" r="2" fill="#ffe082" opacity="0.9"/>
  <circle cx="680" cy="50" r="1.5" fill="#80deea" opacity="0.8"/>
  <circle cx="520" cy="80" r="2.5" fill="#ff80ab" opacity="0.7"/>
  <circle cx="740" cy="95" r="1.5" fill="#fff" opacity="0.6"/>

  <!-- Stadium Lights Glares -->
  <circle cx="80" cy="110" r="45" fill="#fffae6" opacity="0.12" filter="url(#glowF1)"/>
  <circle cx="720" cy="110" r="45" fill="#e0f7fa" opacity="0.12" filter="url(#glowF1)"/>

  <!-- 3D Perspective F1 Circuit Track -->
  <polygon points="350,150 450,150 780,450 20,450" fill="url(#asphaltGrad)"/>

  <!-- Red & White F1 Curbs (Kerbs) on edges -->
  <polygon points="340,150 350,150 20,450 -10,450" fill="#dc2626"/>
  <polygon points="450,150 460,150 810,450 780,450" fill="#dc2626"/>
  
  <!-- Kerb white segments -->
  <polygon points="342,156 349,156 120,380 90,380" fill="#ffffff" opacity="0.85"/>
  <polygon points="345,190 348,190 220,310 190,310" fill="#ffffff" opacity="0.85"/>
  <polygon points="452,156 458,156 710,380 680,380" fill="#ffffff" opacity="0.85"/>

  <!-- Start/Finish Checkered Grid Line -->
  <g opacity="0.85">
    <polygon points="260,360 540,360 560,375 240,375" fill="#111827"/>
    <!-- Checkered squares -->
    <rect x="250" y="360" width="25" height="15" fill="#ffffff"/>
    <rect x="300" y="360" width="25" height="15" fill="#ffffff"/>
    <rect x="350" y="360" width="25" height="15" fill="#ffffff"/>
    <rect x="400" y="360" width="25" height="15" fill="#ffffff"/>
    <rect x="450" y="360" width="25" height="15" fill="#ffffff"/>
    <rect x="500" y="360" width="25" height="15" fill="#ffffff"/>
  </g>

  <!-- F1 Starting Lights Gantry (Semáforo F1 5 Luces Rojas) -->
  <g transform="translate(260, 45)">
    <rect x="0" y="0" width="280" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="2"/>
    <circle cx="35" cy="21" r="12" fill="#ef4444" filter="url(#glowF1)"/>
    <circle cx="87" cy="21" r="12" fill="#ef4444" filter="url(#glowF1)"/>
    <circle cx="140" cy="21" r="12" fill="#ef4444" filter="url(#glowF1)"/>
    <circle cx="192" cy="21" r="12" fill="#ef4444" filter="url(#glowF1)"/>
    <circle cx="245" cy="21" r="12" fill="#ef4444" filter="url(#glowF1)"/>
    <!-- Support poles -->
    <rect x="15" y="42" width="6" height="60" fill="#4b5563"/>
    <rect x="259" y="42" width="6" height="60" fill="#4b5563"/>
  </g>

  <!-- METEOR ON LEFT CAR -->
  <g transform="translate(180, 210) scale(0.75)">
    <!-- Fiery Trail -->
    <path d="M-40,-80 Q20,-20 50,40 Q0,20 -40,-80 Z" fill="url(#meteorFire)" filter="url(#glowF1)"/>
    <!-- Meteorite Rock -->
    <ellipse cx="60" cy="45" rx="36" ry="24" fill="#5c2411" stroke="#ff5722" stroke-width="3" filter="url(#glowF1)"/>
    <ellipse cx="56" cy="42" rx="20" ry="12" fill="#ff7043"/>
    <!-- Sparks -->
    <circle cx="95" cy="30" r="3" fill="#ffe082"/>
    <circle cx="30" cy="65" r="2.5" fill="#ffab00"/>
  </g>

  <!-- PEGASUS WINGS ON RIGHT CAR -->
  <g transform="translate(560, 190) scale(0.85)">
    <!-- Celestial Aura -->
    <circle cx="40" cy="20" r="60" fill="url(#celestialGlow)"/>
    <!-- Wing Left -->
    <path d="M-10,20 C-30,-20 -50,-50 -20,-70 C-5,-60 10,-30 20,20 Z" fill="#e0f7fa" stroke="#00e5ff" stroke-width="2" filter="url(#glowF1)"/>
    <!-- Wing Right -->
    <path d="M50,20 C70,-20 100,-60 120,-40 C100,-25 80,-5 60,20 Z" fill="#ffffff" stroke="#00e5ff" stroke-width="2" filter="url(#glowF1)"/>
    <!-- Wing feathers highlights -->
    <path d="M-5,-40 Q15,-10 20,15" stroke="#80deea" stroke-width="2" fill="none"/>
    <path d="M85,-30 Q65,-5 60,15" stroke="#80deea" stroke-width="2" fill="none"/>
  </g>

  <!-- MAIN HERO FORMULA 1 CAR (RED / CENTER) -->
  <g transform="translate(320, 240)">
    <!-- Super Aura Glow around hero car -->
    <ellipse cx="80" cy="90" rx="140" ry="50" fill="#ff0055" opacity="0.25" filter="url(#superGlow)"/>
    <ellipse cx="80" cy="90" rx="100" ry="35" fill="#ffaa00" opacity="0.3" filter="url(#glowF1)"/>

    <!-- Speed tire sparks -->
    <circle cx="-5" cy="115" r="4" fill="#00f0ff" filter="url(#glowF1)"/>
    <circle cx="165" cy="115" r="4" fill="#00f0ff" filter="url(#glowF1)"/>

    <!-- Rear Wing (Alerón Trasero) -->
    <rect x="15" y="15" width="130" height="14" rx="4" fill="#1e293b" stroke="#ff1744" stroke-width="2"/>
    <rect x="5" y="25" width="20" height="40" rx="3" fill="#0f172a"/>
    <rect x="135" y="25" width="20" height="40" rx="3" fill="#0f172a"/>

    <!-- Rear Wheels (Wide slick tires) -->
    <rect x="-15" y="65" width="30" height="55" rx="6" fill="#111827" stroke="#374151" stroke-width="2"/>
    <circle cx="0" cy="92" r="8" fill="#e11d48"/>
    <rect x="145" y="65" width="30" height="55" rx="6" fill="#111827" stroke="#374151" stroke-width="2"/>
    <circle cx="160" cy="92" r="8" fill="#e11d48"/>

    <!-- Car Main Chassis / Bodywork (F1 Monocoque) -->
    <polygon points="80,145 125,75 110,40 50,40 35,75" fill="url(#redCarGrad)" stroke="#ff4d6d" stroke-width="2"/>
    <!-- Sidepods (Pontones laterales) -->
    <polygon points="25,65 50,45 60,95 20,95" fill="#b91c1c"/>
    <polygon points="135,65 110,45 100,95 140,95" fill="#b91c1c"/>

    <!-- Cockpit & Driver Helmet -->
    <ellipse cx="80" cy="72" rx="14" ry="18" fill="#0f172a"/>
    <!-- Halo Protection Bar -->
    <path d="M66,66 Q80,50 94,66 Q80,60 66,66 Z" fill="#38bdf8" filter="url(#glowF1)"/>
    <!-- Pilot Golden Helmet -->
    <circle cx="80" cy="68" r="8" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <path d="M74,68 Q80,72 86,68" stroke="#111827" stroke-width="2" fill="none"/>

    <!-- Front Nosecone & Wing (Morro y Alerón delantero) -->
    <polygon points="73,120 87,120 84,152 76,152" fill="#dc2626"/>
    <polygon points="10,146 150,146 142,158 18,158" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <polygon points="5,142 25,142 22,158 2,158" fill="#ef4444"/>
    <polygon points="135,142 155,142 158,158 138,158" fill="#ef4444"/>

    <!-- Front Wheels -->
    <rect x="-8" y="115" width="22" height="42" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="146" y="115" width="22" height="42" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>

    <!-- Racing Number / Tag -->
    <circle cx="80" cy="98" r="10" fill="#ffffff"/>
    <text x="80" y="102" font-family="'Impact', 'Arial Black', sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="bold">#1</text>
  </g>

  <!-- SECOND F1 CAR (CYAN / RIGHT) -->
  <g transform="translate(540, 220) scale(0.65)">
    <rect x="15" y="15" width="130" height="14" rx="4" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <rect x="-15" y="65" width="30" height="55" rx="6" fill="#111827"/>
    <rect x="145" y="65" width="30" height="55" rx="6" fill="#111827"/>
    <polygon points="80,145 125,75 110,40 50,40 35,75" fill="url(#cyanCarGrad)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="80" cy="68" r="8" fill="#0284c7"/>
    <polygon points="10,146 150,146 142,158 18,158" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- THIRD F1 CAR (GOLD / LEFT) -->
  <g transform="translate(130, 220) scale(0.65)">
    <rect x="15" y="15" width="130" height="14" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="-15" y="65" width="30" height="55" rx="6" fill="#111827"/>
    <rect x="145" y="65" width="30" height="55" rx="6" fill="#111827"/>
    <polygon points="80,145 125,75 110,40 50,40 35,75" fill="url(#goldCarGrad)" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="80" cy="68" r="8" fill="#d97706"/>
    <polygon points="10,146 150,146 142,158 18,158" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- TITLE BANNER WITH NEON ACCENTS -->
  <g transform="translate(400, 395)">
    <!-- Backdrop banner bar -->
    <rect x="-310" y="-30" width="620" height="56" rx="28" fill="#090d16" fill-opacity="0.9" stroke="#ff0055" stroke-width="2" filter="url(#glowF1)"/>
    
    <!-- Title Text -->
    <text x="0" y="9" font-family="'Montserrat', 'Impact', sans-serif" font-size="34" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      LARGU<tspan fill="#00f0ff">ii</tspan><tspan fill="#ff0055">ito</tspan> <tspan fill="#ffea00">RACING</tspan> 🏎️💨
    </text>
  </g>

  <!-- TikTok Live & Formula 1 Badge Top Left -->
  <g transform="translate(30, 28)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#ff0055" fill-opacity="0.9"/>
    <circle cx="16" cy="15" r="5" fill="#ffffff"/>
    <text x="28" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="1">TIKTOK LIVE</text>
  </g>

  <!-- Interactive Color Feature Pill Top Right -->
  <g transform="translate(560, 28)">
    <rect x="0" y="0" width="210" height="30" rx="15" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="105" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#00f0ff" text-anchor="middle">
      🎨 ¡COMENTA TU COLOR!
    </text>
  </g>
</svg>
