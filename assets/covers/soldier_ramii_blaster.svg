<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueHelmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="redHelmet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Perspective 3D Highway Road -->
  <polygon points="340,140 460,140 680,450 120,450" fill="url(#roadGrad)" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- Road Lane Dividers (White dashed lines) -->
  <line x1="380" y1="140" x2="310" y2="450" stroke="#f8fafc" stroke-width="4" stroke-dasharray="25,20" opacity="0.6"/>
  <line x1="420" y1="140" x2="490" y2="450" stroke="#f8fafc" stroke-width="4" stroke-dasharray="25,20" opacity="0.6"/>

  <!-- Guardrails with neon edges -->
  <polygon points="330,140 340,140 120,450 100,450" fill="#1e293b" opacity="0.8"/>
  <polygon points="460,140 470,140 700,450 680,450" fill="#1e293b" opacity="0.8"/>
  <line x1="330" y1="140" x2="100" y2="450" stroke="#06b6d4" stroke-width="2"/>
  <line x1="470" y1="140" x2="700" y2="450" stroke="#06b6d4" stroke-width="2"/>

  <!-- Red Enemies on the horizon (coming down) -->
  <g transform="translate(370, 160) scale(0.6)">
    <circle cx="0" cy="0" r="16" fill="url(#redHelmet)"/>
    <rect x="-8" y="16" width="16" height="20" rx="4" fill="#ef4444"/>
    <circle cx="50" cy="5" r="16" fill="url(#redHelmet)"/>
    <rect x="42" y="21" width="16" height="20" rx="4" fill="#ef4444"/>
    <circle cx="-50" cy="5" r="16" fill="url(#redHelmet)"/>
    <rect x="-58" y="21" width="16" height="20" rx="4" fill="#ef4444"/>
  </g>

  <!-- Barrels with Numbers (As seen in the screenshot!) -->
  <!-- Left Barrel: "20" with rifle -->
  <g transform="translate(260, 240)">
    <!-- Barrel Body -->
    <rect x="0" y="0" width="70" height="90" rx="14" fill="url(#barrelGrad)" stroke="#451a03" stroke-width="3"/>
    <line x1="0" y1="25" x2="70" y2="25" stroke="#78350f" stroke-width="3"/>
    <line x1="0" y1="65" x2="70" y2="65" stroke="#78350f" stroke-width="3"/>
    <!-- Metal Rings -->
    <rect x="-2" y="18" width="74" height="6" fill="#64748b" rx="2"/>
    <rect x="-2" y="66" width="74" height="6" fill="#64748b" rx="2"/>
    <!-- Number 20 -->
    <text x="35" y="55" font-family="'Impact', Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" stroke="#000" stroke-width="1.5">20</text>
    <!-- Floating Green Rifle on top -->
    <g transform="translate(15, -28)">
      <polygon points="0,10 35,5 40,8 15,14" fill="#10b981" filter="url(#neonGlow)"/>
      <rect x="10" y="10" width="8" height="12" fill="#047857"/>
    </g>
  </g>

  <!-- Right Barrel: "46" with Minigun -->
  <g transform="translate(470, 240)">
    <!-- Barrel Body -->
    <rect x="0" y="0" width="70" height="90" rx="14" fill="url(#barrelGrad)" stroke="#451a03" stroke-width="3"/>
    <line x1="0" y1="25" x2="70" y2="25" stroke="#78350f" stroke-width="3"/>
    <line x1="0" y1="65" x2="70" y2="65" stroke="#78350f" stroke-width="3"/>
    <!-- Metal Rings -->
    <rect x="-2" y="18" width="74" height="6" fill="#64748b" rx="2"/>
    <rect x="-2" y="66" width="74" height="6" fill="#64748b" rx="2"/>
    <!-- Number 46 -->
    <text x="35" y="55" font-family="'Impact', Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle" stroke="#000" stroke-width="1.5">46</text>
    <!-- Floating Cyan Minigun on top -->
    <g transform="translate(10, -32)">
      <rect x="5" y="5" width="30" height="12" rx="3" fill="#0284c7" filter="url(#neonGlow)"/>
      <rect x="35" y="7" width="15" height="8" rx="2" fill="#38bdf8"/>
      <rect x="15" y="17" width="8" height="10" fill="#0369a1"/>
    </g>
  </g>

  <!-- Yellow/Gold Firing Bullets Flying Upwards -->
  <g filter="url(#neonGlow)">
    <line x1="370" y1="400" x2="350" y2="300" stroke="url(#laserGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="430" y1="400" x2="450" y2="300" stroke="url(#laserGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="390" x2="400" y2="280" stroke="url(#laserGrad)" stroke-width="7" stroke-linecap="round"/>
    <line x1="330" y1="420" x2="295" y2="340" stroke="url(#laserGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="420" x2="505" y2="340" stroke="url(#laserGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Blue Soldier Squad at bottom (Player) -->
  <g transform="translate(400, 410)">
    <!-- Center Lead Soldier -->
    <g transform="translate(0, -10)">
      <circle cx="0" cy="-20" r="28" fill="url(#blueHelmet)"/>
      <path d="M -26,-15 Q 0,-28 26,-15" stroke="#0284c7" stroke-width="4" fill="none"/>
      <rect x="-14" y="0" width="28" height="30" rx="6" fill="#0284c7"/>
      <!-- Weapon held -->
      <rect x="12" y="-10" width="12" height="24" rx="2" fill="#0f172a"/>
      <rect x="16" y="-22" width="6" height="14" fill="#38bdf8" filter="url(#neonGlow)"/>
    </g>
    <!-- Left Soldier -->
    <g transform="translate(-55, 5)">
      <circle cx="0" cy="-18" r="24" fill="url(#blueHelmet)"/>
      <rect x="-12" y="0" width="24" height="26" rx="5" fill="#0369a1"/>
    </g>
    <!-- Right Soldier -->
    <g transform="translate(55, 5)">
      <circle cx="0" cy="-18" r="24" fill="url(#blueHelmet)"/>
      <rect x="-12" y="0" width="24" height="26" rx="5" fill="#0369a1"/>
    </g>
  </g>

  <!-- Energy Shield Glow Aura (Semi-transparent) -->
  <ellipse cx="400" cy="400" rx="120" ry="45" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="10,6" opacity="0.7" filter="url(#neonGlow)"/>

  <!-- Logo and Game Title Overlay -->
  <g transform="translate(400, 75)">
    <!-- Background Banner Plaque -->
    <rect x="-310" y="-45" width="620" height="85" rx="22" fill="#070913" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="2.5" filter="url(#neonGlow)"/>
    
    <!-- Title Text -->
    <text x="0" y="-6" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      SOLDIER RAMII BLASTER
    </text>

    <!-- Subtitle Badge -->
    <g transform="translate(0, 22)">
      <rect x="-160" y="-12" width="320" height="22" rx="11" fill="url(#goldGrad)"/>
      <text x="0" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">
        TIKTOK LIVE STREAMER RUNNER
      </text>
    </g>
  </g>
</svg>
