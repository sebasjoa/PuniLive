<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="rideSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1931" />
      <stop offset="50%" stop-color="#183661" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>
    <linearGradient id="nitroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1f3d" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
    <linearGradient id="phoenixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" />
      <stop offset="100%" stop-color="#ff3d00" />
    </linearGradient>
  </defs>

  <!-- Fondo / Cielo Bioma -->
  <rect width="400" height="250" fill="url(#rideSky)" />

  <!-- Sol / Ave Fénix Radiante en el horizonte -->
  <circle cx="200" cy="110" r="55" fill="url(#phoenixGrad)" opacity="0.35" />
  <!-- Silueta Ave Fénix -->
  <path d="M200 80 Q215 65 240 68 Q225 80 220 90 Q245 95 255 110 Q235 112 225 105 Q220 120 200 135 Q180 120 175 105 Q165 112 145 110 Q155 95 180 90 Q175 80 160 68 Q185 65 200 80 Z" fill="url(#phoenixGrad)" opacity="0.85" />

  <!-- Dunas / Montañas de Salto -->
  <path d="M0 250 L0 180 Q80 140 160 175 T320 160 Q365 180 400 170 L400 250 Z" fill="#1b2438" />
  <path d="M0 250 L0 195 Q100 170 200 205 T400 190 L400 250 Z" fill="#0d111a" />

  <!-- Pista de Salto Motocross -->
  <path d="M40 220 Q120 210 180 175 Q210 155 240 185 Q290 220 400 205" stroke="#ff5722" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Moto de Motocross en Salto Aéreo -->
  <g transform="translate(190, 105) rotate(-18)">
    <!-- Fuego Nitro Trasero -->
    <path d="M-35 8 Q-55 12 -70 8 Q-55 4 -35 8" fill="url(#nitroGrad)" />
    <!-- Ruedas -->
    <circle cx="-25" cy="12" r="14" fill="#0a0d14" stroke="#ff5722" stroke-width="4" />
    <circle cx="28" cy="12" r="14" fill="#0a0d14" stroke="#ff5722" stroke-width="4" />
    <!-- Cuadro Moto -->
    <path d="M-25 12 L-5 2 L12 2 L28 12 L8 12 L-5 2" stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round" />
    <!-- Chasis Azul/Naranja -->
    <path d="M-15 0 L15 0 L5 -8 Z" fill="#00bcd4" />
    <!-- Piloto -->
    <circle cx="0" cy="-22" r="7" fill="#ff5722" /> <!-- Casco -->
    <path d="M0 -15 L-8 0 L5 2" stroke="#ffffff" stroke-width="4" stroke-linecap="round" /> <!-- Cuerpo -->
    <path d="M0 -14 L14 -6" stroke="#ff9800" stroke-width="3" stroke-linecap="round" /> <!-- Brazos a Manillar -->
  </g>

  <!-- Efectos de velocidad -->
  <line x1="70" y1="110" x2="130" y2="110" stroke="#ff5722" stroke-width="2" opacity="0.6" stroke-dasharray="8 6" />
  <line x1="90" y1="125" x2="150" y2="125" stroke="#00bcd4" stroke-width="2" opacity="0.5" stroke-dasharray="10 5" />

  <!-- Badge Título estilizado -->
  <rect x="15" y="15" width="130" height="34" rx="6" fill="rgba(10,13,20,0.85)" stroke="rgba(255,255,255,0.15)" />
  <text x="80" y="38" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1">PUNIRIDE</text>
</svg>
